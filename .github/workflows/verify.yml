name: Verificar proyecto
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'app.py'
      - 'build_pitch.py'
      - 'Pitch_RetenIA_Kevin_Erazo.tex'
      - 'requirements.txt'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m compileall -q src app.py run_experiments.py build_pitch.py
